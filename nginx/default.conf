# STEG 1: bare HTTP. Brukes for å hente det første sertifikatet.
# Bytt elev.eksempel.no med deres domene.

server {
    listen 80;
    server_name elev.eksempel.no;

    # Let's Encrypt henter valideringsfilen her
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
