services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/elevside:/usr/share/nginx/html:ro   # nettsiden (det deploy-workflowen skriver til)
      - ./nginx:/etc/nginx/conf.d:ro             # nginx-konfig (mappe, ikke enkeltfil)
      - ./certbot/www:/var/www/certbot:ro        # challenge-filer fra certbot
      - ./certbot/conf:/etc/letsencrypt:ro       # sertifikatene
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot           # samme mappe som nginx serverer challenge fra
      - ./certbot/conf:/etc/letsencrypt          # her lagres sertifikatene
    command: renew                               # kjøres med: docker compose run --rm certbot ...
