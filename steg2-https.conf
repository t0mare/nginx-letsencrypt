# STEG 2: HTTPS. Kopier denne over nginx/default.conf når sertifikatet finnes.
# Bytt elev.eksempel.no med deres domene (fire steder).

server {
    listen 80;
    server_name elev.eksempel.no;

    # Fornyelse trenger fortsatt HTTP, så challenge-stien unntas fra redirecten
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name elev.eksempel.no;

    ssl_certificate     /etc/letsencrypt/live/elev.eksempel.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elev.eksempel.no/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
}
